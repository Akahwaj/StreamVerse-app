name: Publish verified StreamVerse 0.0.57 APK

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/publish-ci-0.0.57-apk.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify exact APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "9995459218"
          EXPECTED_APK: StreamVerse-Fire-TV-universal-arm-0.0.57-ci.apk
          EXPECTED_SHA256: b14bb62ecfc6cf5a8147f17d8ec289abab6ed2f8e857b1634b5b82b6284bf362
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > artifact.zip
          mkdir artifact
          unzip -q artifact.zip -d artifact
          mapfile -t apks < <(find artifact -maxdepth 1 -type f -name '*.apk' | sort)
          test "${#apks[@]}" -eq 1
          test "$(basename "${apks[0]}")" = "$EXPECTED_APK"
          echo "$EXPECTED_SHA256  ${apks[0]}" | sha256sum --check --strict
          echo "APK_PATH=${apks[0]}" >> "$GITHUB_ENV"

      - name: Publish permanent prerelease asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ci-0.0.57
          RELEASE_TARGET: f1d6beb0cca5eb6722856ba5488f55f19c1feaa7
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_PATH" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$APK_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET" \
              --title "StreamVerse 0.0.57 CI APK" \
              --notes "Verified Fire TV test build with Restart StreamVerse, Community Add-ons sidebar access, complete approved non-NSFW directory, session-gated Adult (18+) directory, Live TV, debrid integrations, TMDB/IMDb/MDBList/AniList support, and the original built-in players. CI/test signed; not a production release." \
              --prerelease
          fi