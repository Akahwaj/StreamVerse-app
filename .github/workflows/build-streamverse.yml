name: Build and validate Fire TV APK\n\non:\n  push:\n    branches: [main, fix/fire-tv-arm64-a-to-z]\n    paths:\n      - ".github/workflows/build-streamverse.yml"\n      - "streamverse.patch"\n      - "scripts/verify-fire-tv-apk.sh"\n  workflow_dispatch:\n  workflow_call:\n    inputs:\n      upstream_repository:\n        description: Owner/repository containing the Android TV source\n        type: string\n        default: NuvioMedia/NuvioTV\n      upstream_ref:\n        description: Immutable upstream commit SHA or tag\n        type: string\n        default: b95c899af04189f97284d3c91cb2c478fafc9c04\n      patch_path:\n        description: Optional patch path in the calling repository\n        type: string\n        default: streamverse.patch\n      gradle_task:\n        description: Release Gradle task\n        type: string\n        default: :app:assembleFullRelease\n      expected_abi:\n        description: Single device ABI to package\n        type: string\n        default: arm64-v8a\n      expected_package:\n        description: Expected Android application ID\n        type: string\n        default: com.akahwaj.streamverse\n      min_mib:\n        description: Minimum plausible APK size in MiB\n        type: number\n        default: 40\n      max_mib:\n        description: Maximum plausible APK size in MiB\n        type: number\n        default: 180\n      artifact_name:\n        description: Uploaded APK artifact name\n        type: string\n        default: StreamVerse-Fire-TV-arm64-v8a\n\npermissions:\n  contents: read\n\nconcurrency:\n  group: fire-tv-apk-${{ github.workflow }}-${{ github.ref }}\n  cancel-in-progress: true\n\njobs:\n  build-validate-package:\n    name: Build, inspect, and package ARM64 APK\n    runs-on: ubuntu-latest\n    timeout-minutes: 60\n    env:\n      UPSTREAM_REPOSITORY: ${{ inputs.upstream_repository || 'NuvioMedia/NuvioTV' }}\n      UPSTREAM_REF: ${{ inputs.upstream_ref || 'b95c899af04189f97284d3c91cb2c478fafc9c04' }}\n      PATCH_PATH: ${{ inputs.patch_path || 'streamverse.patch' }}\n      GRADLE_TASK: ${{ inputs.gradle_task || ':app:assembleFullRelease' }}\n      EXPECTED_ABI: ${{ inputs.expected_abi || 'arm64-v8a' }}\n      EXPECTED_PACKAGE: ${{ inputs.expected_package || 'com.akahwaj.streamverse' }}\n      MIN_MIB: ${{ inputs.min_mib || 40 }}\n      MAX_MIB: ${{ inputs.max_mib || 180 }}\n      ARTIFACT_NAME: ${{ inputs.artifact_name || 'StreamVerse-Fire-TV-arm64-v8a' }}\n\n    steps:\n      - name: Check out workflow repository\n        uses: actions/checkout@v4\n        with:\n          path: orchestrator\n\n      - name: Check out pinned Android TV source\n        uses: actions/checkout@v4\n        with:\n          repository: ${{ env.UPSTREAM_REPOSITORY }}\n          ref: ${{ env.UPSTREAM_REF }}\n          path: source\n          fetch-depth: 1\n\n      - name: Set up Java\n        uses: actions/setup-java@v5\n        with:\n          distribution: temurin\n          java-version: "17"\n\n      - name: Set up Android SDK\n        uses: android-actions/setup-android@v3\n\n      - name: Set up Gradle\n        uses: gradle/actions/setup-gradle@v4\n        with:\n          cache-read-only: ${{ github.ref != 'refs/heads/main' }}\n\n      - name: Apply project customization\n        shell: bash\n        run: |\n          set -euo pipefail\n          if [[ -n "$PATCH_PATH" ]]; then\n            patch_file="$GITHUB_WORKSPACE/orchestrator/$PATCH_PATH"\n            [[ -f "$patch_file" ]] || { echo "::error::Patch not found: $PATCH_PATH"; exit 1; }\n            git -C source apply --check "$patch_file"\n            git -C source apply "$patch_file"\n          fi\n\n      - name: Build optimized release APK splits\n        working-directory: source\n        env:\n          CI_USE_DEBUG_SIGNING: "true"\n        shell: bash\n        run: |\n          set -euo pipefail\n          chmod +x ./gradlew\n          ./gradlew "$GRADLE_TASK" --stacktrace\n\n      - name: Select exactly one device APK\n        shell: bash\n        run: |\n          set -euo pipefail\n          mapfile -t matches < <(\n            find source/app/build/outputs/apk -type f \\n              -name "*${EXPECTED_ABI}*.apk" ! -name "*universal*" | sort\n          )\n          if [[ ${#matches[@]} -ne 1 ]]; then\n            printf '::error::Expected exactly one %s APK; found %s\n' "$EXPECTED_ABI" "${#matches[@]}"\n            printf '%s\n' "${matches[@]:-}"\n            exit 1\n          fi\n          mkdir -p dist\n          cp "${matches[0]}" "dist/${ARTIFACT_NAME}.apk"\n          printf 'APK_PATH=%s\n' "$GITHUB_WORKSPACE/dist/${ARTIFACT_NAME}.apk" >> "$GITHUB_ENV"\n\n      - name: Verify APK acceptance gate\n        shell: bash\n        run: |\n          set -euo pipefail\n          bash orchestrator/scripts/verify-fire-tv-apk.sh \\n            "$APK_PATH" "$EXPECTED_ABI" "$EXPECTED_PACKAGE" "$MIN_MIB" "$MAX_MIB"\n\n      - name: Publish verification summary\n        if: always()\n        shell: bash\n        run: |\n          {\n            echo '## Fire TV APK verification'\n            echo\n            if [[ -f apk-verification-summary.txt ]]; then\n              sed 's/^/- /' apk-verification-summary.txt\n            else\n              echo '- Verification did not complete.'\n            fi\n          } >> "$GITHUB_STEP_SUMMARY"\n\n      - name: Upload one installable Fire TV APK\n        uses: actions/upload-artifact@v4\n        with:\n          name: ${{ env.ARTIFACT_NAME }}\n          path: dist/${{ env.ARTIFACT_NAME }}.apk\n          if-no-files-found: error\n          compression-level: 0\n          retention-days: 14\n\n      - name: Upload inspection reports\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: fire-tv-apk-inspection-${{ github.run_id }}\n          path: |\n            apk-verification-summary.txt\n            apk-signature.txt\n            apk-badging.txt\n            apk-manifest-tree.txt\n          if-no-files-found: ignore\n          retention-days: 14\n