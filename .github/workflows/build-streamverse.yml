name: Build StreamVerse Fire TV APK

on:
  push:
    branches: [main, streamverse-native-base]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch GPLv3 NuvioTV source
        run: git clone --depth 1 https://github.com/NuvioMedia/NuvioTV.git nuvio-tv
      - name: Apply StreamVerse changes
        run: git -C nuvio-tv apply ../streamverse.patch
      - name: Build universal debug APK
        working-directory: nuvio-tv
        run: ./gradlew :app:assembleFullDebug --stacktrace
      - name: Upload Fire TV APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamVerse-Fire-TV-debug
          path: nuvio-tv/app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14
