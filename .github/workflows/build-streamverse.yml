name: Build, validate, and release StreamVerse

on:
  push:
    branches:
      - main
      - copilot/update-streaming-logic
      - fix/fire-tv-arm64-a-to-z
    tags:
      - "v*"
    paths:
      - ".github/workflows/build-streamverse.yml"
      - "streamverse*.patch"
      - "scripts/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/build-streamverse.yml"
      - "streamverse*.patch"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Immutable NuvioTV commit SHA or tag
        required: true
        type: string
        default: b95c899af04189f97284d3c91cb2c478fafc9c04
  workflow_call:
    inputs:
      upstream_repository:
        description: Owner/repository containing the Android TV source
        required: false
        type: string
        default: NuvioMedia/NuvioTV
      upstream_ref:
        description: Immutable upstream commit SHA or tag
        required: false
        type: string
        default: b95c899af04189f97284d3c91cb2c478fafc9c04
      patch_path:
        description: Repository-relative StreamVerse patch
        required: false
        type: string
        default: streamverse.patch
      extra_patch_path:
        description: Optional caller-repository patch applied after the public StreamVerse patch set
        required: false
        type: string
        default: ""
      package_id:
        description: Optional Android package ID override for isolated clean-install testing
        required: false
        type: string
        default: com.akahwaj.streamverse
      artifact_name:
        description: Optional artifact name override
        required: false
        type: string
        default: StreamVerse-Fire-TV-universal-arm
    secrets:
      STREAMVERSE_KEYSTORE_B64:
        required: false
      STREAMVERSE_KEY_ALIAS:
        required: false
      STREAMVERSE_KEY_PASSWORD:
        required: false
      STREAMVERSE_STORE_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: streamverse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  UPSTREAM_REPOSITORY: ${{ inputs.upstream_repository || 'NuvioMedia/NuvioTV' }}
  UPSTREAM_REF: ${{ inputs.upstream_ref || 'b95c899af04189f97284d3c91cb2c478fafc9c04' }}
  PATCH_PATH: ${{ inputs.patch_path || 'streamverse.patch' }}
  EXTRA_PATCH_PATH: ${{ inputs.extra_patch_path || '' }}
  EXPECTED_ABIS: armeabi-v7a arm64-v8a
  EXPECTED_PACKAGE: ${{ inputs.package_id || 'com.akahwaj.streamverse' }}
  MIN_MIB: "40"
  MAX_MIB: "240"
  ARTIFACT_NAME: ${{ inputs.artifact_name || 'StreamVerse-Fire-TV-universal-arm' }}

jobs:
  build-validate-package:
    name: UI, catalogs, tracking, Live TV, updater, and APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out StreamVerse orchestration source
        uses: actions/checkout@v4
        with:
          repository: Akahwaj/StreamVerse-app
          ref: main
          path: orchestrator

      - name: Check out caller customization source
        if: ${{ env.EXTRA_PATCH_PATH != '' }}
        uses: actions/checkout@v4
        with:
          path: personal

      - name: Check out pinned Android TV source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_REF }}
          path: source
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Validate and apply StreamVerse customization
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PATCH_PATH" != /* ]] || {
            echo "::error::Patch path must be repository-relative"
            exit 1
          }

          patch_file=$(realpath -m "$GITHUB_WORKSPACE/orchestrator/$PATCH_PATH")
          orchestrator_root=$(realpath "$GITHUB_WORKSPACE/orchestrator")
          [[ "$patch_file" == "$orchestrator_root/"* ]] || {
            echo "::error::Patch path escapes the StreamVerse repository"
            exit 1
          }
          [[ -f "$patch_file" ]] || {
            echo "::error::Patch not found: $PATCH_PATH"
            exit 1
          }

          patch_files=("$patch_file")
          if [[ "${PATCH_PATH##*/}" == "streamverse.patch" ]]; then
            patch_dir=$(dirname "$patch_file")
            for companion in \
              "$patch_dir/streamverse-branding-core.patch" \
              "$patch_dir/streamverse-branding-tv.patch" \
              "$patch_dir/streamverse-premiumize-api-key.patch" \
              "$patch_dir/streamverse-community-live-tv.patch" \
              "$patch_dir/streamverse-restart-settings.patch" \
              "$patch_dir/streamverse-community-sidebar.patch" \
              "$patch_dir/streamverse-adult-addons-gate.patch" \
              "$patch_dir/streamverse-aiometadata-default.patch"; do
              [[ -f "$companion" ]] || {
                echo "::error::Required companion patch not found: ${companion##*/}"
                exit 1
              }
              patch_files+=("$companion")
            done
          fi

          for candidate in "${patch_files[@]}"; do
            echo "Applying ${candidate##*/}"
            git -C source apply --check "$candidate"
            git -C source apply "$candidate"
          done

          if [[ -n "$EXTRA_PATCH_PATH" ]]; then
            [[ "$EXTRA_PATCH_PATH" != /* ]] || {
              echo "::error::Extra patch path must be repository-relative"
              exit 1
            }
            extra_patch=$(realpath -m "$GITHUB_WORKSPACE/personal/$EXTRA_PATCH_PATH")
            personal_root=$(realpath "$GITHUB_WORKSPACE/personal")
            [[ "$extra_patch" == "$personal_root/"* && -f "$extra_patch" ]] || {
              echo "::error::Extra patch path is invalid or missing"
              exit 1
            }
            echo "Applying private caller customization"
            git -C source apply --check "$extra_patch"
            git -C source apply "$extra_patch"
          fi

      - name: Apply isolated package identity
        if: ${{ env.EXPECTED_PACKAGE != 'com.akahwaj.streamverse' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_PACKAGE" =~ ^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$ ]] || {
            echo "::error::Invalid Android package ID: $EXPECTED_PACKAGE"
            exit 1
          }

          sed -i -E \
            "s/applicationId = \"com\.akahwaj\.streamverse\"/applicationId = \"$EXPECTED_PACKAGE\"/" \
            source/app/build.gradle.kts

          grep -Fq "applicationId = \"$EXPECTED_PACKAGE\"" source/app/build.gradle.kts || {
            echo "::error::Failed to apply isolated package ID"
            exit 1
          }

          echo "Using isolated package identity: $EXPECTED_PACKAGE"

      - name: Configure version and signing channel
        id: release-config
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.STREAMVERSE_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.STREAMVERSE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.STREAMVERSE_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STREAMVERSE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          version_code=$((200000 + GITHUB_RUN_NUMBER))

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version_name="${GITHUB_REF_NAME#v}"
            [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
              echo "::error::Release tags must use semantic versioning, for example v1.0.0"
              exit 1
            }

            for value_name in KEYSTORE_B64 KEY_ALIAS KEY_PASSWORD STORE_PASSWORD; do
              [[ -n "${!value_name}" ]] || {
                echo "::error::Stable release signing secret is missing: $value_name"
                exit 1
              }
            done

            key_file="$RUNNER_TEMP/streamverse-release.jks"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$key_file"
            chmod 600 "$key_file"

            {
              echo "CI_USE_DEBUG_SIGNING=false"
              echo "NUVIO_RELEASE_STORE_FILE=$key_file"
              echo "NUVIO_RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "NUVIO_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
              echo "NUVIO_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
              echo "RELEASE_CHANNEL=stable"
            } >> "$GITHUB_ENV"
            echo "stable_signed=true" >> "$GITHUB_OUTPUT"
          else
            version_name="0.0.${GITHUB_RUN_NUMBER}-ci"
            {
              echo "CI_USE_DEBUG_SIGNING=true"
              echo "RELEASE_CHANNEL=ci"
            } >> "$GITHUB_ENV"
            echo "stable_signed=false" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "STREAMVERSE_VERSION_CODE=$version_code"
            echo "STREAMVERSE_VERSION_NAME=$version_name"
          } >> "$GITHUB_ENV"

          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Stamp the APK version into the pinned source
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E \
            "s/^        versionCode = [0-9]+$/        versionCode = $STREAMVERSE_VERSION_CODE/" \
            source/app/build.gradle.kts
          sed -i -E \
            "s/^        versionName = \"[^\"]+\"$/        versionName = \"$STREAMVERSE_VERSION_NAME\"/" \
            source/app/build.gradle.kts

          grep -Fxq "        versionCode = $STREAMVERSE_VERSION_CODE" source/app/build.gradle.kts
          grep -Fxq "        versionName = \"$STREAMVERSE_VERSION_NAME\"" source/app/build.gradle.kts

      - name: Audit UI, catalogs, tracking, Live TV, and updater source
        shell: bash
        run: |
          set -euo pipefail
          bash orchestrator/scripts/verify-streamverse-source.sh \
            source "$GITHUB_WORKSPACE/streamverse-source-audit.txt"

      - name: Run mandatory StreamVerse contract tests
        shell: bash
        run: |
          set -euo pipefail
          bash orchestrator/scripts/test-streamverse-contracts.sh source

      - name: Build release APK
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleFullRelease

      - name: Locate universal APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk_path=$(find source/app/build/outputs/apk/full/release -maxdepth 1 -type f -name '*universal*.apk' | head -n 1)
          [[ -n "$apk_path" && -f "$apk_path" ]] || {
            echo "::error::Universal full release APK not found"
            exit 1
          }
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Validate APK package, size, and ABIs
        shell: bash
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          size_bytes=$(stat -c %s "$APK_PATH")
          size_mib=$((size_bytes / 1024 / 1024))
          (( size_mib >= MIN_MIB && size_mib <= MAX_MIB )) || {
            echo "::error::APK size ${size_mib}MiB is outside expected range ${MIN_MIB}-${MAX_MIB}MiB"
            exit 1
          }

          badging=$(aapt dump badging "$APK_PATH")
          echo "$badging" | grep -q "package: name='$EXPECTED_PACKAGE'" || {
            echo "::error::Unexpected package name; expected $EXPECTED_PACKAGE"
            exit 1
          }

          for abi in $EXPECTED_ABIS; do
            unzip -l "$APK_PATH" | grep -q "lib/$abi/" || {
              echo "::error::Missing expected ABI: $abi"
              exit 1
            }
          done

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Final end-to-end StreamVerse verification
        shell: bash
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail

          [[ -s "$APK_PATH" ]] || {
            echo "::error::Final APK is missing or empty"
            exit 1
          }

          unzip -tqq "$APK_PATH" || {
            echo "::error::Final APK ZIP integrity check failed"
            exit 1
          }

          badging=$(aapt dump badging "$APK_PATH")
          package_line=$(printf '%s\n' "$badging" | grep -m1 '^package:')

          printf '%s\n' "$package_line" | grep -Fq "name='$EXPECTED_PACKAGE'" || {
            echo "::error::Final package mismatch; expected $EXPECTED_PACKAGE"
            exit 1
          }
          printf '%s\n' "$package_line" | grep -Fq "versionCode='$STREAMVERSE_VERSION_CODE'" || {
            echo "::error::Final APK versionCode does not match $STREAMVERSE_VERSION_CODE"
            exit 1
          }
          printf '%s\n' "$package_line" | grep -Fq "versionName='$STREAMVERSE_VERSION_NAME'" || {
            echo "::error::Final APK versionName does not match $STREAMVERSE_VERSION_NAME"
            exit 1
          }

          launchable=$(printf '%s\n' "$badging" | grep -m1 '^launchable-activity:' || true)
          [[ -n "$launchable" ]] || {
            echo "::error::APK has no launchable activity; Fire TV would not be able to start StreamVerse"
            exit 1
          }

          for abi in $EXPECTED_ABIS; do
            unzip -Z1 "$APK_PATH" | grep -q "^lib/$abi/" || {
              echo "::error::Final APK is missing native libraries for $abi"
              exit 1
            }
          done

          [[ -s "$GITHUB_WORKSPACE/streamverse-source-audit.txt" ]] || {
            echo "::error::Source audit report is missing or empty"
            exit 1
          }
          ! grep -q '^FAIL:' "$GITHUB_WORKSPACE/streamverse-source-audit.txt" || {
            echo "::error::Source audit report contains failures"
            exit 1
          }

          bash orchestrator/scripts/test-streamverse-contracts.sh source

          sha256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          size_bytes=$(stat -c %s "$APK_PATH")
          {
            echo "### StreamVerse final verification ✅"
            echo "- Package: \`$EXPECTED_PACKAGE\`"
            echo "- Version: \`$STREAMVERSE_VERSION_NAME\` (\`$STREAMVERSE_VERSION_CODE\`)"
            echo "- Launchable activity: verified"
            echo "- ABIs: \`$EXPECTED_ABIS\`"
            echo "- APK bytes: \`$size_bytes\`"
            echo "- SHA-256: \`$sha256\`"
            echo "- Source audit: passed"
            echo "- Mandatory contracts: passed again after packaging"
            echo "- APK artifact upload step: completed before this gate"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Final StreamVerse verification passed."

      - name: Upload source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StreamVerse-source-audit
          path: streamverse-source-audit.txt
          if-no-files-found: warn
          retention-days: 14
