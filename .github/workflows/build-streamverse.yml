name: Build and validate Fire TV APK

on:
  push:
    branches: [main, copilot/update-streaming-logic, fix/fire-tv-arm64-a-to-z]
    paths:
      - ".github/workflows/build-streamverse.yml"
      - "streamverse.patch"
      - "scripts/verify-fire-tv-apk.sh"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-streamverse.yml"
      - "streamverse.patch"
      - "scripts/verify-fire-tv-apk.sh"
  workflow_dispatch:
  workflow_call:
    inputs:
      upstream_repository:
        description: Owner/repository containing the Android TV source
        type: string
        default: NuvioMedia/NuvioTV
      upstream_ref:
        description: Immutable upstream commit SHA or tag
        type: string
        default: b95c899af04189f97284d3c91cb2c478fafc9c04
      patch_path:
        description: Optional repository-relative patch path
        type: string
        default: streamverse.patch
      gradle_task:
        description: Release Gradle task
        type: string
        default: :app:assembleFullRelease
      expected_abi:
        description: Single device ABI to package
        type: string
        default: arm64-v8a
      expected_package:
        description: Expected Android application ID
        type: string
        default: com.akahwaj.streamverse
      min_mib:
        description: Minimum plausible APK size in whole MiB
        type: number
        default: 40
      max_mib:
        description: Maximum plausible APK size in whole MiB
        type: number
        default: 180
      artifact_name:
        description: Uploaded APK artifact name
        type: string
        default: StreamVerse-Fire-TV-arm64-v8a

permissions:
  contents: read

concurrency:
  group: fire-tv-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-validate-package:
    name: Build, inspect, and package ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UPSTREAM_REPOSITORY: ${{ inputs.upstream_repository || 'NuvioMedia/NuvioTV' }}
      UPSTREAM_REF: ${{ inputs.upstream_ref || 'b95c899af04189f97284d3c91cb2c478fafc9c04' }}
      PATCH_PATH: ${{ inputs.patch_path || 'streamverse.patch' }}
      GRADLE_TASK: ${{ inputs.gradle_task || ':app:assembleFullRelease' }}
      EXPECTED_ABI: ${{ inputs.expected_abi || 'arm64-v8a' }}
      EXPECTED_PACKAGE: ${{ inputs.expected_package || 'com.akahwaj.streamverse' }}
      MIN_MIB: ${{ inputs.min_mib || 40 }}
      MAX_MIB: ${{ inputs.max_mib || 180 }}
      ARTIFACT_NAME: ${{ inputs.artifact_name || 'StreamVerse-Fire-TV-arm64-v8a' }}

    steps:
      - name: Check out workflow repository
        uses: actions/checkout@v4
        with:
          path: orchestrator

      - name: Check out pinned Android TV source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_REF }}
          path: source
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Validate and apply project customization
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$PATCH_PATH" ]]; then
            [[ "$PATCH_PATH" != /* ]] || { echo "::error::Patch path must be repository-relative"; exit 1; }
            patch_file=$(realpath -m "$GITHUB_WORKSPACE/orchestrator/$PATCH_PATH")
            orchestrator_root=$(realpath "$GITHUB_WORKSPACE/orchestrator")
            [[ "$patch_file" == "$orchestrator_root/"* ]] || {
              echo "::error::Patch path escapes the workflow repository"
              exit 1
            }
            [[ -f "$patch_file" ]] || { echo "::error::Patch not found: $PATCH_PATH"; exit 1; }
            git -C source apply --check "$patch_file"
            git -C source apply "$patch_file"
          fi

      - name: Build optimized release APK splits
        working-directory: source
        env:
          CI_USE_DEBUG_SIGNING: "true"
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew "$GRADLE_TASK" --stacktrace

      - name: Select exactly one standalone ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t matches < <(
            find source/app/build/outputs/apk -type f               -name "*${EXPECTED_ABI}*.apk" ! -name "*universal*" | sort
          )
          if [[ ${#matches[@]} -ne 1 ]]; then
            printf '::error::Expected exactly one %s APK; found %s\n' "$EXPECTED_ABI" "${#matches[@]}"
            printf '%s\n' "${matches[@]:-}"
            exit 1
          fi
          mkdir -p dist
          cp "${matches[0]}" "dist/${ARTIFACT_NAME}.apk"
          printf 'APK_PATH=%s\n' "$GITHUB_WORKSPACE/dist/${ARTIFACT_NAME}.apk" >> "$GITHUB_ENV"

      - name: Verify exact Fire TV APK
        shell: bash
        run: |
          set -euo pipefail
          bash orchestrator/scripts/verify-fire-tv-apk.sh             "$APK_PATH" "$EXPECTED_ABI" "$EXPECTED_PACKAGE" "$MIN_MIB" "$MAX_MIB"

      - name: Publish verification summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Fire TV APK verification'
            echo
            if [[ -f apk-verification-summary.txt ]]; then
              sed 's/^/- /' apk-verification-summary.txt
            else
              echo '- Verification did not complete.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload one verified Fire TV APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/${{ env.ARTIFACT_NAME }}.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload inspection reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fire-tv-apk-inspection-${{ github.run_id }}
          path: |
            apk-verification-summary.txt
            apk-signature.txt
            apk-badging.txt
            apk-manifest.xml
            apk-manifest-checks.txt
          if-no-files-found: ignore
          retention-days: 14
