name: Publish verified StreamVerse CI APK

on:
  push:
    branches:
      - release/ci-0.0.33-direct-apk
    paths:
      - .github/workflows/publish-verified-ci-apk.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "9533754591"
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > artifact.zip
          mkdir release
          unzip -q artifact.zip -d release

      - name: Gate exact APK
        id: apk
        run: |
          set -euo pipefail
          mapfile -t apks < <(find release -maxdepth 1 -type f -name '*.apk' | sort)
          [[ ${#apks[@]} -eq 1 ]] || {
            echo "::error::Expected exactly one APK; found ${#apks[@]}"
            exit 1
          }
          expected="5aa075945279ebbf1ff46110498afbee218d6fc1937906ab3722a78982ec2ba2"
          actual=$(sha256sum "${apks[0]}" | cut -d ' ' -f 1)
          [[ "$actual" == "$expected" ]] || {
            echo "::error::APK checksum mismatch"
            exit 1
          }
          echo "path=${apks[0]}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${apks[0]}")" >> "$GITHUB_OUTPUT"

      - name: Publish permanent prerelease asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ci-0.0.33
          TARGET: a7fe1368b5eb4dabd69c800442e3419f96fbb809
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK_PATH"               --target "$TARGET"               --prerelease               --title "StreamVerse 0.0.33 CI"               --notes "Verified Fire TV sideload build from main commit $TARGET. CI/test signed; not a production-stable signing channel."               --repo "$GITHUB_REPOSITORY"
          fi
